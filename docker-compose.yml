name: autoclip

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"   # log rotation: at most 3 x 10 MB per service
    max-file: "3"

x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://autoclip:autoclip@postgres:5432/autoclip
    REDIS_URL: redis://redis:6379/0
    OLLAMA_HOST: http://host.docker.internal:11434
    ENV_FILE_PATH: /app/.env
    SOURCES_FILE: /app/sources.yaml
    CAMPAIGNS_FILE: /app/config/campaigns.yaml
    ACCOUNTS_FILE: /app/config/accounts.yaml
    MEDIA_DIR: /app/media
    BACKUP_DIR: /app/backups
    HF_HOME: /models
  volumes:
    - ./.env:/app/.env  # read-write so refreshed tokens are written back
    - ./sources.yaml:/app/sources.yaml:ro
    - ./config:/app/config:ro
    - ${MEDIA_HOST_DIR:-./media}:/app/media  # large downloads: set MEDIA_HOST_DIR in .env (D:/autoclip/media here)
    - ./secrets:/app/secrets  # Content Rewards browser session for auto-submit (git-ignored)
    - ${BACKUP_HOST_DIR:-./backups}:/app/backups
    - whisper_models:/models
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  logging: *logging

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autoclip
      POSTGRES_PASSWORD: autoclip
      POSTGRES_DB: autoclip
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoclip"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes  # queued jobs survive a restart
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  api:
    <<: *app
    command: sh -c "alembic upgrade head && uvicorn autoclip.main:app --host 0.0.0.0 --port 8000"
    ports:
      # host port 8010: 8000 is already used by another program on this PC
      - "127.0.0.1:8010:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  worker:
    <<: *app
    command: celery -A autoclip.celery_app worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql+psycopg://autoclip:autoclip@postgres:5432/autoclip
      REDIS_URL: redis://redis:6379/0
      OLLAMA_HOST: http://host.docker.internal:11434
      ENV_FILE_PATH: /app/.env
      SOURCES_FILE: /app/sources.yaml
      CAMPAIGNS_FILE: /app/config/campaigns.yaml
      ACCOUNTS_FILE: /app/config/accounts.yaml
      MEDIA_DIR: /app/media
      BACKUP_DIR: /app/backups
      HF_HOME: /models
      # RTX 3050 (4 GB): small model in float16 on the GPU; falls back to CPU if the GPU is unavailable
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: float16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "celery -A autoclip.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3

  # Records allowlisted streams while they are live and queues chunks for the worker (autoclip/live_daemon.py)
  live:
    <<: *app
    command: python -m autoclip.live_daemon
    healthcheck:
      disable: true

  beat:
    <<: *app
    command: celery -A autoclip.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    healthcheck:
      disable: true

  web:
    build: ./web
    environment:
      API_URL: http://api:8000
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:3010:3000"  # 3000 is used by grafana on this PC
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  redisdata:
  whisper_models:
